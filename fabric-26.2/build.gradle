plugins {
    id 'net.fabricmc.fabric-loom' // version pinned in the root build.gradle
}

group = 'mcheli'
version = '0.1.0'

// Minecraft 26.x is unobfuscated: this Loom plugin uses Mojang's official names and does NOT remap
// (plain implementation/compileOnly + jar — no modImplementation/remapJar). 26.x requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

// Same shared MCHeli content the NeoForge module bundles (see the root build.gradle). Version-specific vanilla JSON
// (item models / client items, particle defs, recipes) goes in this module's own src/main/resources.
sourceSets.main.resources.srcDir rootProject.file('mcheli-assets')

loom {
    // Access widening ("class tweaker" in 26.x Loom; fabric.mod.json still uses the "accessWidener" key).
    accessWidenerPath = file("src/main/resources/mcheli.classtweaker")

    // Client-only code lives in src/client; Loom fails the build if src/main references client classes.
    splitEnvironmentSourceSets()

    mods {
        mcheli {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        server {
            // Headless self-tests are OFF by default (see mcheli.MCHeli#registerSelfTests). Opt in with
            //   ./gradlew :fabric-26.2:runServer -PmcheliSelfTests[=<name>[,<name>...]]
            // which also halts the server once the verdict is logged, so the run terminates by itself.
            if (project.hasProperty('mcheliSelfTests')) {
                def sel = project.property('mcheliSelfTests').toString()
                property 'mcheli.selftests', sel.isBlank() ? 'true' : sel
                property 'mcheli.selftest.halt', 'true'
            }
        }
    }
}

// Client gametests (Fabric API client-gametest): a scripted real client — create a world, spawn vehicles, ride one,
// screenshot. Code lives in src/gametest; run with ./gradlew :fabric-26.2:runClientGameTest (screenshots land in
// build/run/clientGameTest/screenshots).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mcheli-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The agnostic layer (pure Java, Java 21 bytecode — loads fine on 25). Unlike ModDevGradle, Loom's dev runs
    // put plain library jars straight on Knot's classpath, so `implementation` covers compile AND dev runtime;
    // `include` embeds it as a Jar-in-Jar in the production mod jar.
    implementation project(':mcheli-agnostic')
    include project(':mcheli-agnostic')

    // Optional mods for integration testing in dev runs only (never bundled): drop jars into fabric-26.2/compat-mods/
    // (gitignored). E.g. TaCZ Refabricated + ForgeConfigAPIPort + PlayerAnimationLib for the TaCZ gametest.
    localRuntime fileTree(dir: 'compat-mods', include: '*.jar')
}

// Production smoke test: installs a real Fabric server (installer + loader) and runs the BUILT jar with the Fabric API
// jar — no dev environment, no Loom classpath. ./gradlew :fabric-26.2:prodServer (stop it with `stop`/Ctrl+C).
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    installerVersion = '1.1.2'
    loaderVersion = project.loader_version
    minecraftVersion = project.minecraft_version
    mods.from(tasks.named('jar'))
    mods.from(configurations.detachedConfiguration(
        dependencies.create("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")).setTransitive(false))
    programArgs.add('--nogui')
    runDir = layout.buildDirectory.dir('run/prodServer')
    doFirst {
        def dir = runDir.get().asFile
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}
